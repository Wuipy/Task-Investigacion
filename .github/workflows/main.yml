name: Build, publish and deploy to MonsterASP.NET
on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
          
      - name: Install dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish HackerRank1/HackerRank1.csproj --configuration Release --output ./publish /p:AspNetCoreHostingModel=OutOfProcess

      - name: Verify publish output
        run: |
          if (!(Test-Path ./publish/HackerRank1.dll)) { throw "HackerRank1.dll not found in publish folder" }
          if (!(Test-Path ./publish/web.config)) { throw "web.config not found in publish folder" }
          Get-ChildItem ./publish -Name | Select-Object -First 20
      - name: Test with .NET
        run: dotnet test

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: publish
